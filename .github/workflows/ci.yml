name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip2
          components: rustfmt
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.254.0 --locked
      - name: Repository checks
        env:
          PRAZOPAY_WASM_ARTIFACT_DIR: ${{ runner.temp }}/prazopay-wasm-artifacts
        run: bash ./scripts/reproduce.sh
      - name: Upload WASM reproducibility evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-repro-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prazopay-wasm-artifacts
          if-no-files-found: error
          retention-days: 1
