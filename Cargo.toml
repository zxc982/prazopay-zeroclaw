[workspace]
members = [
    "clients/*",
    "programs/*",
    "plugins/*",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anchor-client = "1.1.2"
anchor-lang = "1.1.2"
anyhow = "1"
base64 = "0.22"
bincode = "1"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
thiserror = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
